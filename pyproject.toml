[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-api-client"
version = "0.0.1"
description = "A small client library for the calendar/trainer backend API."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "pydantic>=2.0",
]
license = { text = "MIT" }
keywords = ["calendar", "trainer", "api", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/lolvalolee/calendar-api-client"
Repository = "https://github.com/lolvalolee/calendar-api-client"
Issues = "https://github.com/lolvalolee/calendar-api-client/issues"

[tool.setuptools.packages.find]
include = ["calendar_scripts*"]
